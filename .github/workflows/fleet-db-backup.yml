name: fleet-db-backup

# Nightly dump of the Turso database + a restore REHEARSAL on every run.
#
# Closes the backup gap open since the 2026-08-02 architecture review (#539).
# Two properties are load-bearing:
#
# 1. Platform-auth-free. `turso db dump` needs a browser-OAuth platform login a
#    workflow cannot do; `db dump` instead speaks plain SQL through the same
#    DATABASE-level url+token every other nightly already holds as secrets.
# 2. The restore is rehearsed EVERY night, not once: `db verify-dump` loads the
#    dump into a fresh scratch engine and compares restored row counts against
#    the INSERT counts in the dump text itself. A dump that cannot restore is
#    not a backup — and an unverified backup discovered broken during a disaster
#    is this repo's canonical failure shape.
#
# The artifact is encrypted (gpg symmetric, BACKUP_PASSPHRASE secret) because a
# dump carries client lead data (submissions) and site config.
#
# The artifact lives 30 days and only on GitHub. Once a month (the first night
# of the UTC month) the same ENCRYPTED file is also copied to Dropbox as
# /Processes & Procedures/Backups/turso/turso-YYYY-MM.sql.gpg and kept indefinitely
# (Operator decisions 97(g)). That copy can never turn the backup red.
on:
  workflow_dispatch: # manual run from the Actions tab; the nightly conductor dispatches it with no inputs
    inputs:
      dropbox_copy:
        description: "Copy tonight's encrypted dump to Dropbox even if it is not the first of the month"
        type: boolean
        default: false

concurrency:
  group: fleet-db-backup
  cancel-in-progress: false

permissions:
  contents: read
  issues: write # open/close the backup-failure tracking issue

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      # The monthly off-GitHub copy (OD 97(g)) is decided FIRST, so a run that
      # goes red before the copy on a copy night still knows it was one and
      # files "Monthly Dropbox backup copy failing". (A 1st on which the
      # conductor dispatched nothing files only the conductor's own issue.)
      # The copy itself runs after the artifact upload.
      - name: Decide the monthly Dropbox copy
        id: dropbox-due
        env:
          FORCE: ${{ inputs.dropbox_copy }}
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
        run: |
          # Shell and date only: this step has no continue-on-error, so nothing
          # in it may reach the network.
          month=$(date -u +%Y-%m)
          due=false
          if [ "$(date -u +%d)" = "01" ] || [ "${FORCE:-false}" = "true" ]; then
            missing=""
            for v in DROPBOX_APP_KEY DROPBOX_APP_SECRET DROPBOX_REFRESH_TOKEN; do
              [ -n "${!v:-}" ] || missing="$missing $v"
            done
            if [ -n "$missing" ]; then
              echo "::warning::monthly Dropbox copy skipped: the Actions secret(s)${missing} are unset in this repo. The backup itself is unaffected."
            else
              due=true
            fi
          fi
          if [ "$due" = "true" ] && [ "${GITHUB_REF:-}" != "refs/heads/main" ]; then
            echo "::notice::monthly Dropbox copy: due, but this run is on ${GITHUB_REF:-an unknown ref}, and only main copies; the copy step will be skipped."
          fi
          echo "dropbox copy due=$due month=$month"
          { echo "due=$due"; echo "month=$month"; } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Dump + rehearse the restore
        timeout-minutes: 15
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: |
          set -o pipefail
          out="${RUNNER_TEMP:-/tmp}"
          node dist/cli/bin.js db dump > "$out/dump.sql"

          # An empty or schema-only dump means the dump path broke, not that the
          # fleet vanished. Gate on the sites table specifically: it has held
          # 40+ rows since import and never legitimately empties.
          if ! grep -qE '^INSERT INTO sites ' "$out/dump.sql"; then
            echo "::error::db backup: dump contains NO sites rows — dump path broken (not uploading)."
            exit 1
          fi

          # Rehearse: load into a scratch engine and compare what came back
          # against the ORIGIN MANIFEST the dump carries — row counts per table,
          # every table the app owns, the total header-image BLOB bytes, and a
          # sha256 per table over every cell (a flipped blob byte passed the
          # counts and the byte total until 2026-10-05).
          #
          # This used to compare the dump against ITSELF (expected counts parsed
          # out of the dump text, actual counts from loading that same text), so
          # a dump that collected 5 of 44 sites shrank both numbers together and
          # verified clean. Absent line = never ran; mismatches red.
          node dist/cli/bin.js db verify-dump --file "$out/dump.sql" | tee "$out/verify.out"
          grep -qE '^DUMP_VERIFY loaded=true .* mismatches=0$' "$out/verify.out" || {
            echo "::error::db backup: restore rehearsal FAILED — see DUMP_VERIFY above."
            exit 1
          }

      - name: Encrypt
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          if [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "::error::db backup: BACKUP_PASSPHRASE secret is unset — refusing to upload a plaintext dump."
            exit 1
          fi
          out="${RUNNER_TEMP:-/tmp}"
          gpg --batch --symmetric --cipher-algo AES256 \
            --passphrase "$BACKUP_PASSPHRASE" \
            --output "$out/dump.sql.gpg" "$out/dump.sql"

          # Verify what we KEEP, not only what we made. Everything above this
          # line checked `dump.sql`, which is then deleted — nothing had ever
          # decrypted the .gpg that actually gets uploaded, so a corrupt or
          # truncated encryption would have shipped green (`if-no-files-found`
          # only catches a MISSING file). Decrypt it back and re-run the same
          # gate on the round-tripped copy.
          gpg --batch --quiet --decrypt \
            --passphrase "$BACKUP_PASSPHRASE" \
            --output "$out/dump.check.sql" "$out/dump.sql.gpg"
          node dist/cli/bin.js db verify-dump --file "$out/dump.check.sql" | tee "$out/verify.enc.out"
          grep -qE '^DUMP_VERIFY loaded=true .* mismatches=0$' "$out/verify.enc.out" || {
            echo "::error::db backup: the ENCRYPTED artifact does not round-trip — refusing to upload it."
            exit 1
          }

          rm "$out/dump.sql" "$out/dump.check.sql"

      - name: Upload encrypted dump
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: turso-backup-${{ github.run_id }}
          path: ${{ runner.temp }}/dump.sql.gpg
          retention-days: 30
          if-no-files-found: error

      # continue-on-error: a Dropbox outage or a revoked token must never fail
      # the backup. Its failure files "Monthly Dropbox backup copy failing"
      # below instead. main only: a branch dispatch must never overwrite the
      # month's copy with a dump made by the branch's own code.
      - name: Copy the encrypted dump to Dropbox
        id: dropbox
        if: steps.dropbox-due.outputs.due == 'true' && github.ref == 'refs/heads/main'
        continue-on-error: true
        timeout-minutes: 10
        env:
          MONTH: ${{ steps.dropbox-due.outputs.month }}
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
        run: |
          set -o pipefail
          out="${RUNNER_TEMP:-/tmp}"
          if ! [[ "$MONTH" =~ ^[0-9]{4}-[0-9]{2}$ ]]; then
            echo "::warning::monthly Dropbox copy FAILED: month \"$MONTH\" is not YYYY-MM; nothing uploaded."
            exit 1
          fi
          # dropbox.mjs uploads under the file's own name, so give the
          # ENCRYPTED dump the month's name. The plaintext was deleted by the
          # Encrypt step and is never named here.
          name="turso-$MONTH.sql.gpg"
          mkdir -p "$out/dropbox"
          cp "$out/dump.sql.gpg" "$out/dropbox/$name"
          # The account line carries the owner's email; this repo's run logs
          # are public, so keep the rest of the line and drop the address.
          node scripts/dropbox.mjs upload "/Processes & Procedures/Backups/turso" "$out/dropbox/$name" \
            | sed -E 's/ <[^<>]*@[^<>]*>//g' | tee "$out/dropbox.out" || true
          # Gate on dropbox.mjs's own lines, not its exit code: the account it
          # wrote with is the team space, and the month's file came back with
          # a matching size and content_hash. Absent line = never ran.
          if ! grep -qE '^account: ' "$out/dropbox.out"; then
            echo "::warning::monthly Dropbox copy FAILED: dropbox.mjs stopped before naming an account (see its error above; a 400 invalid_grant or 401 means DROPBOX_REFRESH_TOKEN must be re-authorized)."
            exit 1
          fi
          if ! grep -qE '^account: .*\(team space\)$' "$out/dropbox.out"; then
            echo "::warning::monthly Dropbox copy FAILED: dropbox.mjs did not write as the team space (see the account line above); the copy would land elsewhere."
            exit 1
          fi
          if ! grep -qiE "^ok /Processes & Procedures/Backups/turso/turso-${MONTH}\.sql\.gpg [0-9]+ bytes content_hash [0-9a-f]{64} matches local$" "$out/dropbox.out"; then
            echo "::warning::monthly Dropbox copy FAILED: no hash-matched upload of $name (see dropbox.mjs above)."
            exit 1
          fi
          echo "monthly Dropbox copy ok: /Processes & Procedures/Backups/turso/$name"

      # Mirror fleet-smoke's alarm plumbing: a red nightly is otherwise only a
      # best-effort email. continue-on-error so the alert machinery can never
      # turn a green run red.
      - name: Open/update the backup-failure tracking issue
        # failure() is false on a CANCELLED run — a hang to a timeout filed nothing
        # for fleet-lighthouse 36451921171. main only: a branch run never speaks
        # for main (a PR-branch dispatch of time-travel closed #895 while main was red).
        if: (failure() || cancelled()) && github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          JOB_STATUS: ${{ job.status }}
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Nightly Turso backup failing"
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          body=$(printf 'The nightly **fleet-db-backup** run failed.\n\nRun: %s\n\n_Auto-filed; auto-closes on the next green run._' "$run_url")
          # A cancelled run is a hang (a step past its timeout-minutes, the job past its
          # limit) or a hand cancel, not the failure the text above describes. Say so.
          if [ "${JOB_STATUS:-}" = "cancelled" ]; then
            body=$(printf '**This run was CANCELLED, not failed**: a step hung past its timeout, the job hit its time limit, or someone cancelled it. The text below was written for a failure; read the step that was running when the run stopped before trusting it.\n\n%s' "$body")
          fi
          existing=$(gh issue list --state open --limit 200 \
            --search "in:title \"$title\"" --json number,title \
            --jq "map(select(.title==\"$title\")) | .[0].number // empty" || true)
          if [ -n "$existing" ]; then
            # Rewrite the body too, so the issue head names THIS run rather than the
            # first failure's (P1-11: #895 closed naming a run 8 days stale), and keep
            # the comment as the history. Neither stops the other: under `bash -e` a
            # failed command left of `&&` does not end the script.
            gh issue edit "$existing" --body "$body" && echo "rewrote the body of #$existing" \
              || echo "::warning::could not rewrite the body of #$existing; commenting anyway"
            gh issue comment "$existing" --body "$body" && echo "commented on existing #$existing"
          else
            gh issue create --title "$title" --body "$body"
          fi

      - name: Close the backup-failure issue on recovery
        # main only: a green PR-branch dispatch of time-travel closed #895 while main was red.
        if: success() && github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Nightly Turso backup failing"
          for n in $(gh issue list --state open --limit 200 \
            --search "in:title \"$title\"" --json number,title \
            --jq "map(select(.title==\"$title\")) | .[].number" || true); do
            gh issue close "$n" --comment "Recovered — the nightly Turso backup is green again." && echo "closed #$n"
          done

      # Finding-keyed, like fleet-security's protection gap: keyed on the copy
      # step's own outcome, since the run stays green when only the copy fails.
      # It also files when a copy night's run went red or was cancelled before
      # the copy (skipped), so no month is lost in silence. Any other night
      # with no copy neither files nor closes.
      - name: Open/update the Dropbox-copy tracking issue
        if: (steps.dropbox.outcome == 'failure' || ((failure() || cancelled()) && steps.dropbox-due.outputs.due == 'true' && steps.dropbox.outcome != 'success')) && github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Monthly Dropbox backup copy failing"
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          body=$(printf 'This run did not take this month'"'"'s copy of the encrypted Turso dump to Dropbox `/Processes & Procedures/Backups/turso`. An earlier run this month may already have; look for `turso-YYYY-MM.sql.gpg` there first. Either the "Copy the encrypted dump to Dropbox" step failed (the 30-day artifact was already uploaded, so the backup itself is fine), or the run went red or was cancelled before the copy (then "Nightly Turso backup failing" names that too).\n\nRead the run for the cause. A `401`, `invalid_grant` or `missing_scope` from dropbox.mjs means the app'"'"'s one-time authorization must be redone and the `DROPBOX_REFRESH_TOKEN` secret replaced (`scripts/dropbox.mjs`). Then dispatch **fleet-db-backup** on main with `dropbox_copy: true` to take this month'"'"'s copy.\n\nRun: %s\n\n_Auto-filed; auto-closes on the next successful copy._' "$run_url")
          existing=$(gh issue list --state open --limit 200 \
            --search "in:title \"$title\"" --json number,title \
            --jq "map(select(.title==\"$title\")) | .[0].number // empty" || true)
          if [ -n "$existing" ]; then
            # Rewrite the body to this run's and keep the comment as the history
            # (P1-11). Neither stops the other.
            gh issue edit "$existing" --body "$body" && echo "rewrote the body of #$existing" \
              || echo "::warning::could not rewrite the body of #$existing; commenting anyway"
            gh issue comment "$existing" --body "$body" && echo "commented on existing #$existing"
          else
            gh issue create --title "$title" --body "$body"
          fi

      - name: Close the Dropbox-copy issue on a successful copy
        if: success() && github.ref == 'refs/heads/main' && steps.dropbox.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Monthly Dropbox backup copy failing"
          for n in $(gh issue list --state open --limit 200 \
            --search "in:title \"$title\"" --json number,title \
            --jq "map(select(.title==\"$title\")) | .[].number" || true); do
            gh issue close "$n" --comment "Recovered — this month's encrypted dump is in Dropbox \`/Processes & Procedures/Backups/turso\`." && echo "closed #$n"
          done

  # How much of the plan's quota the fleet has burned this billing cycle.
  #
  # A SEPARATE job, deliberately: a quota alarm must never stop the backup from
  # being taken and kept, and the two failures want different tracking issues —
  # "the backup is broken" and "you are approaching a wall" are not the same
  # page to open at 9am.
  #
  # Why this alarm exists at all: the org runs on the starter plan with
  # `"overages": false`, which means crossing a quota BLOCKS reads and writes
  # rather than billing for them. Turso is the only store the fleet has, so
  # quota exhaustion is a total outage with no warning
  # shot. As of 2026-08-26 the worst metric sits at 0.36% of its ceiling, so this
  # is a smoke detector, not a running concern.
  #
  # Needs TURSO_FLEET_USAGE — a PLATFORM API token (`turso auth api-tokens mint`),
  # which is a different and more privileged credential than the database-level
  # TURSO_AUTH_TOKEN above. The database token cannot read quota state at all.
  quota:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Check plan-quota headroom
        timeout-minutes: 5
        env:
          TURSO_FLEET_USAGE: ${{ secrets.TURSO_FLEET_USAGE }}
        run: |
          set -o pipefail
          out="${RUNNER_TEMP:-/tmp}"
          node dist/cli/bin.js db usage | tee "$out/usage.out"

          # Gate on the MARKER, not only on the exit code. A step that printed
          # nothing and exited 0 is the "absent success marker" shape (#585):
          # it reads as a clean run and proves nothing. An unset secret lands
          # here as verdict=no-token and reds the job on purpose — an alarm
          # nobody configured is not a quiet alarm, it is no alarm.
          grep -qE '^FLEET_DB_USAGE .* verdict=ok$' "$out/usage.out" || {
            echo "::error::Turso quota check did not return verdict=ok — see FLEET_DB_USAGE above."
            exit 1
          }

      - name: Open/update the quota tracking issue
        # failure() is false on a CANCELLED run — a hang to a timeout filed nothing
        # for fleet-lighthouse 36451921171. main only: a branch run never speaks
        # for main (a PR-branch dispatch of time-travel closed #895 while main was red).
        if: (failure() || cancelled()) && github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          JOB_STATUS: ${{ job.status }}
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Turso plan quota needs attention"
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          body=$(printf 'The nightly Turso **quota check** did not return `verdict=ok`.\n\nThe org is on a plan with `overages: false`, so a crossed quota BLOCKS reads and writes rather than billing for them.\n\nRun: %s\n\n_Auto-filed; auto-closes on the next green run._' "$run_url")
          # A cancelled run is a hang (a step past its timeout-minutes, the job past its
          # limit) or a hand cancel, not the failure the text above describes. Say so.
          if [ "${JOB_STATUS:-}" = "cancelled" ]; then
            body=$(printf '**This run was CANCELLED, not failed**: a step hung past its timeout, the job hit its time limit, or someone cancelled it. The text below was written for a failure; read the step that was running when the run stopped before trusting it.\n\n%s' "$body")
          fi
          existing=$(gh issue list --state open --limit 200 \
            --search "in:title \"$title\"" --json number,title \
            --jq "map(select(.title==\"$title\")) | .[0].number // empty" || true)
          if [ -n "$existing" ]; then
            # Rewrite the body too, so the issue head names THIS run rather than the
            # first failure's (P1-11: #895 closed naming a run 8 days stale), and keep
            # the comment as the history. Neither stops the other: under `bash -e` a
            # failed command left of `&&` does not end the script.
            gh issue edit "$existing" --body "$body" && echo "rewrote the body of #$existing" \
              || echo "::warning::could not rewrite the body of #$existing; commenting anyway"
            gh issue comment "$existing" --body "$body" && echo "commented on existing #$existing"
          else
            gh issue create --title "$title" --body "$body"
          fi

      - name: Close the quota issue on recovery
        # main only: a green PR-branch dispatch of time-travel closed #895 while main was red.
        if: success() && github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Turso plan quota needs attention"
          for n in $(gh issue list --state open --limit 200 \
            --search "in:title \"$title\"" --json number,title \
            --jq "map(select(.title==\"$title\")) | .[].number" || true); do
            gh issue close "$n" --comment "Recovered — Turso quota headroom is back within threshold." && echo "closed #$n"
          done
