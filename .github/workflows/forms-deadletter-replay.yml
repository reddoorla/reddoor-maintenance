name: forms-deadletter-replay

# MED-10(a). Drain the form dead-letter queue on a schedule.
#
# The queue exists because ingest persists a lead it cannot place (#539 Phase 0):
# a Turso or lookup blip dead-letters the submission, the visitor is told
# "accepted" — truthfully, the lead IS stored — and the row waits. #785 and #833
# put the queue's DEPTH in front of the operator (the `deadletter` attention item
# reaches both the cockpit and the digest). Nothing drained it. The recovery was
# a CLI command someone had to remember, so between a blip at 02:00 and whenever
# a person next read the cockpit, real client leads sat un-notified.
#
# Every six hours, because that is the recovery time a transient outage needs and
# more than that is noise: the alarm is already continuous, this is the hands.
on:
  schedule:
    - cron: "47 */6 * * *" # 00:47 / 06:47 / 12:47 / 18:47 UTC, off the top of the hour
  workflow_dispatch: {} # manual run from the Actions tab

# Single-flight, and load-bearing rather than hygiene: two concurrent replays
# would read the same unreplayed row and each re-ingest it, minting a duplicate
# submission for one lead. cancel-in-progress is FALSE for the same reason — a
# cancelled replay is a run killed between an ingest and its terminal mark, which
# is precisely the MED-10(b) state this change exists to make rare and visible.
concurrency:
  group: forms-deadletter-replay
  cancel-in-progress: false

permissions:
  contents: read # checkout only
  issues: write # open/close the replay-failure tracking issue

jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # No Airtable credentials, deliberately. Replay resolves sites through
      # `makeLazySiteLookup`, which under the freeze reads Turso and never
      # constructs the Airtable base at all — so this workflow adds no dependency
      # on a layer Phase 6 is about to remove. RESEND_API_KEY is optional by the
      # same code path the live handler uses: without it recovered leads land
      # un-emailed (notify=failed) rather than blocking the recovery.
      - name: Replay the dead-letter queue
        id: replay
        timeout-minutes: 15
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          OPERATOR_EMAIL: ${{ vars.OPERATOR_EMAIL }}
        run: |
          out="${RUNNER_TEMP:-/tmp}"

          # `db replay-deadletters` exits 1 whenever anything is still OWED, and
          # "owed" is not the same as "broken" — so the exit code is captured,
          # not obeyed. See the gate below for which of the four counters is a
          # failure and which is a standing condition.
          set +e
          node dist/cli/bin.js db replay-deadletters > "$out/replay.out" 2>&1
          code=$?
          set -e
          cat "$out/replay.out"

          # Absent marker = the command did not reach its own summary: bad
          # credentials, a thrown migration, a crash. That is the "absent success
          # marker" shape (#585) and it is always red — a step that printed
          # nothing and exited 0 reads as a clean run and proves nothing.
          line=$(grep -aE '^DEADLETTER_REPLAY ' "$out/replay.out" | tail -1 || true)
          if [ -z "$line" ]; then
            echo "::error::deadletter replay: no DEADLETTER_REPLAY marker — the replay did not complete (exit $code)."
            exit 1
          fi

          n_replayed=$(printf '%s\n' "$line" | sed -nE 's/.* replayed=([0-9]+).*/\1/p')
          n_still_failing=$(printf '%s\n' "$line" | sed -nE 's/.* still_failing=([0-9]+).*/\1/p')
          n_unmarked=$(printf '%s\n' "$line" | sed -nE 's/.* unmarked=([0-9]+).*/\1/p')
          n_unreadable=$(printf '%s\n' "$line" | sed -nE 's/.* unreadable=([0-9]+).*/\1/p')
          if [ -z "$n_replayed" ] || [ -z "$n_still_failing" ] || [ -z "$n_unmarked" ] || [ -z "$n_unreadable" ]; then
            echo "::error::deadletter replay: marker is missing a counter (an older CLI, or a renamed field): $line"
            exit 1
          fi

          # DEFECTS — red. Neither has any other surface anywhere in the system:
          #   unmarked  = a lead was re-ingested but its terminal mark did not
          #               persist, so the row is queued AND already has a
          #               submission. The next run duplicates it. This run's log
          #               is the only record that exists (MED-10b).
          #   unreadable = a queued row whose stored JSON will not decode. It can
          #               never replay on its own and it is not visible as
          #               anything but a number in the depth alarm (MED-10c).
          if [ "$n_unmarked" -gt 0 ] || [ "$n_unreadable" -gt 0 ]; then
            echo "::error::deadletter replay: unmarked=$n_unmarked unreadable=$n_unreadable — see the UNMARKED/UNREADABLE lines above. An unmarked row will be DUPLICATED by the next run."
            exit 1
          fi

          # STANDING CONDITION — not red. `still_failing` is a row whose site does
          # not resolve yet: it waits for `ensure-site <slug>`, or for a decision
          # recorded with `--abandon`. It already has an alarm — the `deadletter`
          # attention item, in the cockpit and the digest, per slug, with the
          # right instruction attached. Reddening this job for it would file a
          # tracking issue every six hours for a condition a person has already
          # been told about and has to act on by hand, and repeated false alarms
          # on one issue title are exactly how a real red stops being read.
          if [ "$n_still_failing" -gt 0 ]; then
            echo "::warning::deadletter replay: $n_still_failing row(s) still queued — see the cockpit's deadletter item for the slug(s). Not a run failure."
          fi
          echo "PASS: replayed=$n_replayed still_failing=$n_still_failing unmarked=$n_unmarked unreadable=$n_unreadable"

      # Same alarm plumbing as every other nightly here: a red run is otherwise
      # only GitHub's best-effort email to the last pusher. continue-on-error so
      # the alert machinery can never turn a green run red.
      - name: Open/update the replay-failure tracking issue
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Form dead-letter replay failing"
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          body=$(printf 'The scheduled **forms-deadletter-replay** run failed.\n\nThis is NOT the ordinary "rows are queued" condition — that is a warning and stays green. It means the replay could not complete, or it found a row that was re-ingested without its terminal mark (the next run would duplicate that lead), or a row whose stored payload will not decode.\n\nRun: %s\n\n_Auto-filed; auto-closes on the next green run._' "$run_url")
          existing=$(gh issue list --state open --limit 200 \
            --search "in:title \"$title\"" --json number,title \
            --jq "map(select(.title==\"$title\")) | .[0].number // empty" || true)
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body" && echo "commented on existing #$existing"
          else
            gh issue create --title "$title" --body "$body"
          fi

      - name: Close the replay-failure issue on recovery
        if: success()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Form dead-letter replay failing"
          for n in $(gh issue list --state open --limit 200 \
            --search "in:title \"$title\"" --json number,title \
            --jq "map(select(.title==\"$title\")) | .[].number" || true); do
            gh issue close "$n" --comment "Recovered — the dead-letter replay is green again." && echo "closed #$n"
          done
