# One-off probe (2026-10-21): does Netlify enforce the dashboard's per-IP
# `rateLimit` configs? Sends 80 paced requests from one runner IP to two
# limited paths and prints every status. Runs only on this branch; never merged.
name: rate-limit-probe

on:
  push:
    branches: [claude/rate-limit-one-ip-probe]

permissions: {}

jobs:
  burst:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      N: 50
    steps:
      - name: Burst from one IP
        shell: bash
        run: |
          set -u
          ip() { curl -sS https://api.ipify.org; echo; }
          # 80 requests spread over ~40 s: inside one 60 s window, and slow
          # enough that Netlify's "up to 10 seconds" before blocking has passed
          # well before the last request.
          burst() {
            local label=$1 url=$2 limit=$3
            echo "=== $label  $url  (declared windowLimit $limit / 60 s)"
            echo "egress IP before: $(ip)"
            echo "start $(date -u +%H:%M:%S.%N)"
            : > codes.txt
            for i in $(seq 1 ${N:-80}); do
              code=$(curl -sS --path-as-is -o /dev/null -w '%{http_code}' "$url")
              printf '%s %02d %s\n' "$(date -u +%H:%M:%S.%N | cut -c1-12)" "$i" "$code"
              echo "$code" >> codes.txt
              sleep ${PAUSE:-0.5}
            done
            echo "end   $(date -u +%H:%M:%S.%N)"
            echo "egress IP after: $(ip)"
            echo "counts:"; sort codes.txt | uniq -c
            echo "headers of one more request:"
            curl -sS -D - -o /dev/null "$url" | grep -iv '^set-cookie'
            echo
          }
          # Run 4 (2026-10-21, PR #1645): the one-function shape on its deploy
          # preview. One shared budget (120/60 s) on pages and /api/*, its own
          # 30/60 s on /auth/*, and the dot-segment path the review asked about
          # (does /_app/%2e%2e/fleet dodge the limit by its raw prefix?).
          # Preview only; production is not touched.
          P=https://deploy-preview-1645--reddoor-maintenance.netlify.app
          N=135 PAUSE=0.15 burst page "$P/fleet/__data.json" 120
          echo "--- 65 s pause"; sleep 65
          N=135 PAUSE=0.15 burst api "$P/api/sites/probe/details" 120
          echo "--- 65 s pause"; sleep 65
          N=45 PAUSE=0.3 burst auth "$P/auth/login" 30
          echo "--- 65 s pause"; sleep 65
          N=135 PAUSE=0.15 burst dotseg "$P/_app/%2e%2e/fleet" 120
