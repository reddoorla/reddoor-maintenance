name: fleet-db-sync

# Hourly Airtable → Turso sync + parity check — the Phase 2 backbone of the
# migration (#539).
#
# In Phase 2 readers move to Turso while writers still write Airtable, so Turso
# is only as fresh as this run. Every pass both refreshes the copy (import with
# attachment fetches only where the stored row lacks a body) and PROVES it
# converged (the parity harness — the same instrument the cutover trusts), with
# one internal retry to absorb a write landing between the import's read and the
# parity check's read. `FLEET_SYNC … mismatches=0` is emitted on every clean
# run; an absent line means the sync crashed, never that it was clean.
#
# Cadence: hourly at :20 — clear of the 04:30 fleet-db-backup, the 05:23
# prismic-drift, and the 06:00 security sweep. ~6 Airtable API reads per run.
on:
  schedule:
    - cron: "20 * * * *"
  workflow_dispatch: {} # manual run from the Actions tab

concurrency:
  group: fleet-db-sync
  cancel-in-progress: false

permissions:
  contents: read
  issues: write # open/close the sync-failure tracking issue

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Sync Airtable → Turso and check parity
        timeout-minutes: 10
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          AIRTABLE_PAT: ${{ secrets.AIRTABLE_PAT }}
          AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
        run: |
          set -o pipefail
          out="${RUNNER_TEMP:-/tmp}"
          node dist/cli/bin.js db sync | tee "$out/sync.out"

          # Absent-line guard: `db sync` exits 1 on a persistent mismatch, but a
          # run that somehow exits 0 WITHOUT the machine line never actually
          # synced — red, per the instrument rule.
          grep -qE '^FLEET_SYNC .* mismatches=0$' "$out/sync.out" || {
            echo "::error::db sync: FLEET_SYNC line missing or mismatches>0 — Turso and Airtable drifted."
            exit 1
          }

      # Mirror fleet-db-backup's alarm plumbing: a red hourly is otherwise only
      # a best-effort email. continue-on-error so the alert machinery can never
      # turn a green run red.
      - name: Open/update the sync-failure tracking issue
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Hourly Turso sync failing"
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          body=$(printf 'The hourly **fleet-db-sync** run failed — Phase 2 readers may be seeing stale fleet state.\n\nRun: %s\n\n_Auto-filed; auto-closes on the next green run._' "$run_url")
          existing=$(gh issue list --state open --json number,title \
            --jq "map(select(.title==\"$title\")) | .[0].number // empty" || true)
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body" && echo "commented on existing #$existing"
          else
            gh issue create --title "$title" --body "$body"
          fi

      - name: Close the sync-failure issue on recovery
        if: success()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Hourly Turso sync failing"
          for n in $(gh issue list --state open --json number,title \
            --jq "map(select(.title==\"$title\")) | .[].number" || true); do
            gh issue close "$n" --comment "Recovered — the hourly Turso sync is green again." && echo "closed #$n"
          done
