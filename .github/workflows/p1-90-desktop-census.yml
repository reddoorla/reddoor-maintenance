# Temporary: the P1-90 desktop-width overflow census (reddoorla/reddoor-maintenance#1876).
# Runs only on pushes to its own branch, which is never merged.
name: p1-90 desktop census
on:
  push:
    branches: [claude/p1-90-desktop-census]
permissions:
  contents: read
jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
      - name: Install Playwright and measure()
        working-directory: census-p1-90
        run: |
          npm init -y >/dev/null
          npm pkg set type=module
          npm install --no-audit --no-fund playwright@1.59.1 @reddoorla/maintenance@0.113.0
          node node_modules/playwright/cli.js install --with-deps chromium
      - name: Shots
        working-directory: census-p1-90
        run: mkdir -p out && node shots.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: p1-90-shots
          path: census-p1-90/out/
