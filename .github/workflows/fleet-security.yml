name: fleet-security

# Nightly fleet-wide security audit against each active site, writing the vuln counts + a freshness
# timestamp back to its Airtable row so the "Security Updates" checklist box can auto-tick.
# Repo-backed sites use GitHub Dependabot alerts (prod+dev); sites with no repo / no token fall back
# to `pnpm/npm audit`. UNLIKE fleet-lighthouse this stays checkout-FUL — the `pnpm audit` fallback
# reads each repo's committed lockfile, so every site is cloned. Kept a SEPARATE job from
# fleet-lighthouse precisely so the lighthouse/domain/browser sweep stays checkout-free.
#
# Also runs the `deps` audit here (it likewise needs each repo's checkout + lockfile): declared-range
# drift vs the fleet baseline plus the real `pnpm outdated` counts (incl. majors-behind-registry),
# written to the Deps* columns. deps is the only fleet audit with no cron of its own, so it rides
# this checkout-ful job — at the cost of a per-repo `pnpm install --frozen-lockfile` (deps-outdated
# needs node_modules present). A site whose frozen install fails writes a null outdated count, never
# a wrong one.
on:
  schedule:
    - cron: "0 6 * * *" # 06:00 UTC — before the 08:00 lighthouse sweep + 09:23 drafts
  workflow_dispatch: {} # manual run from the Actions tab

concurrency:
  group: fleet-security
  cancel-in-progress: false

permissions:
  contents: read
  issues: write # open/close the nightly-failure tracking issue (parity with fleet-lighthouse)

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # Mint short-lived reddoor-renovate App installation tokens for every
      # fleet-wide GitHub call in this job — replaces the retired org RENOVATE
      # PAT (2026-08 rotation) with the same App identity Renovate runs as.
      # `owner:` widens the token from this repo to the whole installation
      # (all reddoorla repos), which the fleet sweeps need. Minted TWICE
      # (here + after the 45-minute audit) because installation tokens expire
      # after 60 minutes — a single early mint could hand the late steps a
      # dead token and silently mute them.
      # Digest-pinned: this mints a fleet-write token, so a mutable tag ref is
      # a supply-chain hole (same rule as renovate.yml); Renovate bumps these.
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          app-id: ${{ vars.RENOVATE_APP_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
          owner: reddoorla

      - name: Fleet security + deps audit + Airtable write-back
        # Repo-backed sites are audited from GitHub Dependabot alerts (ground truth: prod+dev,
        # GitHub Advisory DB) via the REST API. Sites with no repo (or when the alerts API is
        # unreachable/forbidden) fall back to `pnpm audit` against the committed lockfile — which is
        # why every fleet repo is still cloned (unauthenticated https — the fleet is public; a
        # private repo would fail its clone and be skipped+warned by prepareFleetSites, never fatal,
        # box stays manual). A failed/skipped audit writes NO counts + NO timestamp, so it can never
        # tick the box.
        #
        # Widened from 30→45m: deps adds a sequential `pnpm install --frozen-lockfile` per repo
        # (~12 sites, warm pnpm store via setup-node cache), on top of the existing security sweep.
        timeout-minutes: 45
        env:
          AIRTABLE_PAT: ${{ secrets.AIRTABLE_PAT }}
          AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          # Reads Dependabot alerts. The minted reddoor-renovate App token is reused as
          # GITHUB_TOKEN; the App's "Dependabot alerts: read" permission covers the fleet repos.
          # WITHOUT that permission the alerts endpoint 403s and each repo-backed site GRACEFULLY
          # falls back to `pnpm audit` (prior behavior) — a missing permission degrades, never breaks.
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -o pipefail
          # A site reporting vulns (security) or major drift (deps) exits non-zero by design; key the
          # gate on the machine-readable FLEET_WRITE_SUMMARY line, not the exit code (same pattern as
          # fleet-lighthouse).
          node dist/cli/bin.js audit \
            --fleet airtable \
            --only security,deps \
            --write-airtable \
            --concurrency 1 \
            --workdir /tmp/fleet-security | tee /tmp/audit.out || true

          # `|| true`: under Actions' default `set -e`, a no-match grep in a command
          # substitution would abort the step before the explicit diagnostic below runs.
          summary=$(grep -oE "FLEET_WRITE_SUMMARY wrote=[0-9]+ failed=[0-9]+ total=[0-9]+" /tmp/audit.out | tail -n1 || true)
          if [ -z "$summary" ]; then
            echo "::error::fleet security printed no write summary — the run crashed before write-back (check Airtable creds / clone)."
            exit 1
          fi
          wrote=$(echo "$summary" | grep -oE "wrote=[0-9]+" | cut -d= -f2)
          failed=$(echo "$summary" | grep -oE "failed=[0-9]+" | cut -d= -f2)
          total=$(echo "$summary" | grep -oE "total=[0-9]+" | cut -d= -f2)
          echo "fleet write-back: wrote=$wrote failed=$failed total=$total"

          # Surface every partial miss as a visible annotation, even one within
          # tolerance — a tolerated single-site flake is then never invisible.
          if [ "$failed" -gt 0 ]; then
            notwritten=$(grep -oE "[0-9]+ site\(s\) not written:.*" /tmp/audit.out | tail -n1 || true)
            echo "::warning::fleet security: $failed/$total site(s) not written — $notwritten"
          fi

          # A site that couldn't even be prepared (bad/scheme-less URL + no repo, or a
          # private repo whose clone fails) is dropped rather than crashing the run
          # (resilient fleet prep). Raise it so the misconfigured Airtable row gets fixed.
          skipped=$(grep -oE "⚠ [0-9]+ site\(s\) skipped \(could not prepare\):.*" /tmp/audit.out | tail -n1 || true)
          if [ -n "$skipped" ]; then
            echo "::warning::fleet security: $skipped"
          fi

          # Total write-back failure: nothing landed at all (creds/API/inventory). This
          # is the silent-green hazard — every site's "Security Updates" box would stay
          # unticked while the job reported success.
          if [ "$wrote" -eq 0 ]; then
            echo "::error::fleet security wrote 0 of $total site(s) — total write-back failure (check Airtable creds / API)."
            exit 1
          fi

          # Mass flake: more than 25% of attempted sites failed to write. A single
          # known-flaky site stays green-with-warning; a real outage reds.
          if [ $((failed * 4)) -gt "$total" ]; then
            echo "::error::fleet security: $failed/$total site(s) failed to write (>25%) — investigate (not a single-site flake)."
            exit 1
          fi

      # Best-effort follow-up: kick Renovate for each active, repo-backed site just
      # flagged with critical/high vulns. Renovate's OSV vulnerability alerts bypass
      # the schedule, so the remediation PR opens now; GitHub platform auto-merge is
      # disabled fleet-wide, so Renovate merges it from inside its own run per the
      # shared preset. Runs only when the sweep above succeeded (default step
      # semantics) — though counts for any site the sweep failed/skipped to write are
      # last-known, not fresh; a stale-high false dispatch is a harmless Renovate
      # no-op, and a repo with an already-open Renovate PR is skipped. NEVER fails the
      # security job — a missing token clean-skips, and a per-repo failure (no
      # renovate.yml / token lacks actions:write) is a warning, not a red.
      # Re-mint for the late steps: the audit above can run up to 45 minutes
      # and installation tokens die at 60 — see the first mint's comment.
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token-late
        with:
          app-id: ${{ vars.RENOVATE_APP_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
          owner: reddoorla

      - name: Trigger Renovate for sites with actionable vulnerabilities
        timeout-minutes: 10
        env:
          AIRTABLE_PAT: ${{ secrets.AIRTABLE_PAT }}
          AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
          RENOVATE_TOKEN: ${{ steps.app-token-late.outputs.token }}
        run: |
          node dist/cli/bin.js renovate-dispatch --fleet | tee /tmp/dispatch.out || true
          summary=$(grep -oE "RENOVATE_DISPATCH_SUMMARY dispatched=[0-9]+ skipped=[0-9]+ failed=[0-9]+" /tmp/dispatch.out | tail -n1 || true)
          echo "renovate-dispatch: ${summary:-<no summary — see output above>}"
          failed=$(echo "$summary" | grep -oE "failed=[0-9]+" | cut -d= -f2 || true)
          if [ -n "$failed" ] && [ "$failed" -gt 0 ]; then
            echo "::warning::renovate-dispatch: $failed repo(s) failed to dispatch (check the reddoor-renovate App's Actions:write permission / renovate.yml present)."
          fi

      # Org-wide protection coverage: every PUBLIC repo must carry a sound branch
      # ruleset (active, EMPTY bypass list, PR-required — the layer that binds
      # admins, which classic protection's enforce_admins:false never did). The
      # self-updating recipe heals fleet sites, but it is cron-less and
      # Airtable-scoped — exactly how six repos (one with NO protection at all)
      # sat unprotected until the 2026-08-01 hand audit. This nightly sweep
      # enumerates the org from the API and alarms on any gap.
      #
      # continue-on-error + a DEDICATED tracking issue, deliberately NOT a red
      # job: a red here would fire the generic "Nightly fleet security audit
      # failing" issue below and misdirect triage at the vuln sweep. The
      # dedicated title is the signal; it auto-closes on the next clean pass.
      - name: Protection coverage audit (org-wide)
        id: protection
        continue-on-error: true
        env:
          RENOVATE_TOKEN: ${{ steps.app-token-late.outputs.token }}
        run: |
          # pipefail is NOT in Actions' default `bash -e {0}` shell — without it,
          # `| tee` would swallow the audit's exit 1 and this step could never
          # report failure (the review caught this alarm shipping DEAD).
          set -o pipefail
          # An empty minted token (failed mint step) must be a FAILURE here, not
          # the CLI's local-dev clean-skip: a skip verifies zero repos, and
          # treating it as success would auto-close real gap issues below.
          if [ -z "$RENOVATE_TOKEN" ]; then
            echo "::error::protection-audit: minted App token is empty — cannot verify coverage."
            exit 1
          fi
          node dist/cli/bin.js protection-audit --org reddoorla | tee /tmp/protection.out

      - name: Open/update the protection-gap tracking issue
        if: steps.protection.outcome == 'failure'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Fleet protection coverage gap"
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          detail=$(grep -E "^GAP" /tmp/protection.out || echo "see run output")
          body=$(printf 'The nightly protection-coverage sweep found public repo(s) below the fleet posture floor — a sound branch ruleset, secret scanning + push protection enabled, and a renovate workflow that actually runs (or the sweep could not verify one of those):\n\n```\n%s\n```\n\nHeal: run `reddoor-maint self-updating <site>` for fleet sites, or fix by hand for non-site repos (spec: docs/superpowers/specs/2026-08-02-ruleset-self-healing-design.md). Renovate gaps: a DISABLED workflow rejects dispatches — `gh workflow enable renovate.yml -R <repo>` first, then `gh workflow run`. A never-succeeded/stale one: dispatch once; if the gap returns in 3 days the schedule never registered — push a commit touching the workflow file.\n\nRun: %s\n\n_Auto-filed; auto-closes on the next clean sweep._' "$detail" "$run_url")
          existing=$(gh issue list --state open --json number,title \
            --jq "map(select(.title==\"$title\")) | .[0].number // empty" || true)
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body" && echo "commented on existing #$existing"
          else
            gh issue create --title "$title" --body "$body"
          fi

      - name: Close the protection-gap issue on a clean sweep
        if: steps.protection.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Belt and braces: close ONLY on positive evidence of a verified clean
          # sweep — the gaps=0 machine line, which a skip/crash run never prints.
          # Step outcome alone is not proof (any path that exits 0 without
          # auditing would otherwise convert into a false "Recovered" close).
          if ! grep -q "PROTECTION_AUDIT gaps=0 " /tmp/protection.out 2>/dev/null; then
            echo "no verified clean sweep in the output — not closing anything"
            exit 0
          fi
          title="Fleet protection coverage gap"
          for n in $(gh issue list --state open --json number,title \
            --jq "map(select(.title==\"$title\")) | .[].number" || true); do
            gh issue close "$n" --comment "Recovered — the protection-coverage sweep verified every public repo clean." && echo "closed #$n"
          done

      # A red nightly is otherwise only GitHub's best-effort email to the last pusher.
      # File/reopen a single deduped tracking issue so a failure is durably visible, and
      # auto-close it once the run goes green again. continue-on-error so the alert
      # machinery can NEVER turn a run's status red. A DISTINCT title from
      # fleet-lighthouse's ("Nightly fleet audit failing") so the two workflows never
      # comment on or close each other's issue.
      - name: Open/update the nightly-failure tracking issue
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Nightly fleet security audit failing"
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          body=$(printf 'The nightly **fleet-security** run failed.\n\nRun: %s\n\n_Auto-filed; auto-closes on the next green run._' "$run_url")
          existing=$(gh issue list --state open --json number,title \
            --jq "map(select(.title==\"$title\")) | .[0].number // empty" || true)
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body" && echo "commented on existing #$existing"
          else
            gh issue create --title "$title" --body "$body"
          fi

      - name: Close the nightly-failure issue on recovery
        if: success()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Nightly fleet security audit failing"
          for n in $(gh issue list --state open --json number,title \
            --jq "map(select(.title==\"$title\")) | .[].number" || true); do
            gh issue close "$n" --comment "Recovered — the nightly fleet-security run is green again." && echo "closed #$n"
          done
