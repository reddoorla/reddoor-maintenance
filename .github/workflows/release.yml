name: release

on:
  push:
    branches: [main]
  # Manual lever for when the push-triggered run is unusable. On 2026-09-03 the
  # two runs created by the 0.93.1 version-PR merge were stuck `queued` with no
  # jobs ever allocated and no attempt ever incremented, while other runs in the
  # same repo and branch succeeded — a GitHub-side broken run, not a runner
  # shortage. `gh run rerun` could not revive them and `gh run cancel` refused
  # them as "completed", so publishing needed a fresh push event, which meant
  # inventing a commit. Dispatching is idempotent: with changesets pending it
  # updates the version PR, and without them it publishes only versions the
  # registry does not already have.
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      # Mint a reddoor-renovate App token scoped to THIS repo only (no `owner:` —
      # create-github-app-token's default when owner/repositories are omitted):
      # the changesets action only pushes and opens PRs here, so the release job
      # never needs fleet reach. Replaces the retired org RENOVATE PAT
      # (2026-08 rotation). Digest-pinned per renovate.yml.
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          app-id: ${{ vars.RENOVATE_APP_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          # Authenticate git with the App token (not the default GITHUB_TOKEN).
          # The "Version Packages" branch PUSH must come from the App's bot
          # user: a GITHUB_TOKEN push is recursion-guarded (no push event
          # fires) and makes the PR's pull_request runs trigger as
          # github-actions[bot] → gated in "action_required". An App-authored
          # push (like a PAT one) fires ci.yml (see its push trigger on this
          # branch) and the check goes green without an admin approving each
          # release cycle. Since changesets/action v2 that push is authorized by
          # the action's own `github-token` input (below), which it installs as
          # a per-push Authorization header over this one; this token keeps
          # every other git call in the job (`changeset publish` asks the remote
          # whether a tag already exists) on the same identity. Publishing
          # still uses npm OIDC (id-token: write), independent of this token.
          token: ${{ steps.app-token.outputs.token }}

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: pnpm
          registry-url: "https://registry.npmjs.org"

      # npm OIDC trusted publishing requires npm CLI 11.5+; Node 22 ships ~10.x.
      #
      # PINNED to the 11.x line — do NOT restore `npm@latest`. npm 12 changed
      # `npm info <pkg> --json` to return an ARRAY of packuments instead of a
      # single object, so the top-level `versions` field disappears. That field
      # is exactly what @changesets/cli (getUnpublishedPackages) reads to decide
      # what is already on the registry: with it missing, `publishedVersions`
      # falls back to `[]`, every version looks unpublished, and changesets
      # re-publishes an already-published version on every push to main. npm
      # correctly rejects that with E403, and changesets then crashes in
      # isAlreadyPublishedError (`json.error.summary` is undefined) instead of
      # taking its graceful "already published → skip" path — turning every
      # release run red. Latent since npm 12.0.1 (2026-07-10); first fired
      # 2026-07-20 on the first main push after 0.75.1 published.
      # Revisit once @changesets/cli handles npm 12's output shape.
      #
      # Since @changesets/cli v3 it does not ask npm at all here: with pnpm >= 11
      # it looks the package up with `pnpm info` (its getPublishTool picks the
      # pnpm tool, and that tool's `info`), so npm 12's shape no longer reaches
      # that decision. The publish itself is `pnpm publish` under both CLI
      # versions, and pnpm 11 exchanges the OIDC token itself, so nothing here
      # still depends on npm 11. The pin stays anyway; lifting it is its own
      # change.
      - run: npm install -g npm@^11.5.0

      - run: pnpm install --frozen-lockfile

      # Same reason as ci.yml: `tests/prospect/interaction-harness.test.ts`
      # drives a REAL Chromium, Playwright ships no browser with the npm
      # package, and this job runs the same suite. ci.yml gained this step in
      # `ec4ec55` and release.yml did not, so the merge that added the spec went
      # green on the PR and red on main forty seconds later — the two lists were
      # one gate in `pnpm verify` and two in setup.
      - name: Install the browser the Tier 4 abort harness drives
        run: pnpm exec playwright install --with-deps chromium

      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm test

      # changesets/action v2 needs @changesets/cli v3 and refuses to start with
      # CLI v2; CLI v3 under action v1 publishes but never tags or creates the
      # GitHub Release (v1 looks for a `New tag:` line CLI v3 no longer prints).
      # The two move together (#955). With changesets pending, this runs
      # version-script and pushes `changeset-release/main`, opening or updating
      # the version PR; with none, it runs publish-script, then pushes a
      # `v<version>` tag and creates the GitHub Release for each package the CLI
      # reports through the CHANGESETS_OUTPUT file the action hands it.
      #
      # No NPM_TOKEN: trusted publishing uses the OIDC token from id-token: write.
      # `changeset publish` runs `pnpm publish`, and pnpm 11 exchanges the
      # GitHub Actions OIDC token for a short-lived npm token itself when a
      # trusted publisher is configured on the package.
      - name: Create release PR or publish
        id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          # Use the minted App token (not the built-in GITHUB_TOKEN) so the
          # "Version Packages" PR this action opens actually TRIGGERS ci.yml.
          # GitHub does not start workflow runs for events made with the built-in
          # GITHUB_TOKEN (recursion guard), which left every release PR's required
          # `build` check stuck in "action_required" and unmergeable without an
          # admin override. The reddoor-renovate App has contents + pull-requests
          # write (it opens the fleet's Renovate PRs). Publishing still uses npm
          # OIDC (id-token: write) — this token authors the version PR (shown as
          # reddoor-renovate[bot]), pushes the `v*` tag and creates the Release.
          #
          # It must be this INPUT. v2 reads the token only from `github-token`,
          # whose default is the built-in token, and fails the step when a
          # GITHUB_TOKEN env var is set to anything else — so there is no env
          # block here any more, and dropping this line would quietly bring back
          # the "action_required" release PRs described above.
          github-token: ${{ steps.app-token.outputs.token }}
          publish-script: pnpm run release
          version-script: pnpm run version-packages
          commit-message: "chore(release): version packages"
          pr-title: "chore(release): version packages"
          # Push with git, exactly as v1 did: v1's `commitMode` defaulted to
          # "git-cli" and this file never set it. v2 defaults to the GitHub API
          # instead, which is not a drop-in here. Updating an existing version PR
          # through the API creates and deletes a temporary
          # `changesets-ghcommit-temp/changeset-release/main` branch on every run,
          # and the release tag becomes a lightweight ref at the triggering commit
          # instead of the annotated `v*` tag `changeset publish` makes locally.
          # With git, the version-only run that updates the PR exercises the same
          # push path and the same `github-token` that the publish run's tag push
          # then uses. `push-git-tags` and `create-github-releases` keep their v2
          # defaults (true); the tag is load-bearing, because
          # scripts/check-match-harness-snapshots.mjs compares against the newest
          # `v*` tag.
          push-with-git-cli: true

      # v2 only warns when the tag push fails ("Failed to create git tag …
      # Assuming it was manually pushed") and still creates the GitHub Release,
      # which then makes a LIGHTWEIGHT tag at whatever main's HEAD is by then.
      # v1 failed the step instead. The snapshot guard
      # (scripts/check-match-harness-snapshots.mjs) compares against the newest
      # `v*` tag, so a missing or misplaced tag must turn this run red. The
      # peeled `^{}` line exists only for an annotated tag, and it must name the
      # commit that was published.
      - name: Verify the release tag is annotated and on the published commit
        if: steps.changesets.outputs.published == 'true'
        run: |
          v="v$(node -p "require('./package.json').version")"
          head="$(git rev-parse HEAD)"
          tagged="$(git ls-remote origin "refs/tags/${v}^{}" | cut -f1)"
          if [ -z "$tagged" ] || [ "$tagged" != "$head" ]; then
            echo "::error::${v} is not an annotated tag on ${head} (peeled: ${tagged:-none}). Push it by hand: git tag -a ${v} ${head} -m ${v} && git push origin ${v}"
            exit 1
          fi
          echo "${v} is annotated on ${head}"
