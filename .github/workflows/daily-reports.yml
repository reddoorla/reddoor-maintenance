name: daily-reports

# M3 daily approval-only loop. One run per day: DRAFT due reports (idempotent —
# skip site+period already drafted), SEND approved-but-unsent (existing gate),
# then email the operator DIGEST. This repo is the central scheduler; it's
# active, so GitHub's 60-day cron auto-disable never fires — but the keepalive
# step below is a belt-and-suspenders against a quiet stretch. Cron minute is
# :23 (non-:00) to dodge the documented top-of-hour scheduler load spike.
on:
  schedule:
    - cron: "23 9 * * *" # 09:23 UTC daily, offset off the top of the hour
  workflow_dispatch:
    # Manual run from the Actions tab. Left blank, this is the normal daily loop.
    #
    # `preview_site` turns the run into a read-only credential proof instead:
    # `report <slug> --preview` renders one site's report through the very same
    # draft path — including the GA and Search Console enrichment — but takes
    # previewOnly, so it never queues a draft, never writes an Airtable Reports
    # row, and never consumes the (site, period) idempotency guard. The send and
    # digest steps are skipped, so no email leaves the runner either.
    #
    # This exists because the GA/Search Console credentials are only wired into
    # THIS workflow's draft step. A local run proves the code path but not the
    # repository secrets, and the secrets were exactly what was missing when
    # every CI-drafted report shipped with a blank ANALYTICS section (#469).
    # Waiting for the next naturally-due report to find out is a multi-week
    # feedback loop on a credential that either works or silently does not.
    inputs:
      preview_site:
        description: "Airtable Website NAME (e.g. Sonder) — render one report preview to prove the GA/Search Console secrets. Blank = normal daily run."
        required: false
        type: string
        default: ""

# Single-flight: a once-daily job can't realistically overlap, but this closes
# the search-then-create drafting race (Airtable has no atomic upsert) and stops
# a manual run colliding with the scheduled one.
concurrency:
  group: m3-daily
  cancel-in-progress: false

permissions:
  contents: read # checkout only — nothing in this workflow pushes
  actions: write # inline keepalive re-enables this workflow via the REST API
  issues: write # open/close the daily-reports-failing tracking issue

jobs:
  daily:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # generateHeaderImage screenshots each site's homepage at draft time, so
      # this job needs a browser. Without it chromium.launch() throws and the
      # refresh — which is best-effort and swallows its errors — would fail
      # silently every night while the run stayed green.
      - run: pnpm exec playwright install --with-deps chromium

      # The header's domain line is drawn by sharp through librsvg + fontconfig,
      # so compose.ts's font stack resolves against INSTALLED system fonts. A
      # stock ubuntu runner has no Helvetica Neue / Helvetica / Arial and falls
      # through to DejaVu Sans, which is wider — a CI-generated header would not
      # match the hand-made reference or a locally-generated one. fonts-urw-base35
      # provides Nimbus Sans, metrically equivalent to Helvetica and already third
      # in that stack. Runs after `playwright install --with-deps`, which has
      # already done the apt-get update.
      - run: sudo apt-get install -y --no-install-recommends fonts-urw-base35

      # 1. DRAFT — scan all Websites, draft anything overdue. Idempotent: the
      # slice-1 Period guard skips a (site, reportType) already drafted this
      # cycle, so a cron re-fire is a no-op. continue-on-error: a draft failure
      # must not block sending reports already approved — but the outcome-gate
      # step at the bottom re-fails the run afterwards so the spec's "any step
      # failing opens the tracking issue" still holds (no silent draft breakage).
      # GA + Search Console enrichment runs at DRAFT time (fetchGaUsers / fetchSearch),
      # so the credentials have to be on THIS step — the send step re-reads the numbers
      # off the Reports row and needs nothing. Without them readGaConfig() returns null
      # and both fetches take their not-configured early return, which is how every
      # CI-drafted report shipped with no ANALYTICS section and no "Google Indexed"
      # evidence. GA_SA_KEY_JSON is the service-account key file's CONTENTS; it is
      # written to a runner-local path here because the code takes a path, not a blob.
      # `printf` (not `echo`) and no `set -x`: the key must never reach the log.
      - name: Draft due reports
        id: draft
        continue-on-error: true
        timeout-minutes: 15
        env:
          AIRTABLE_PAT: ${{ secrets.AIRTABLE_PAT }}
          AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
          GA_SUBJECT: ${{ secrets.GA_SUBJECT }}
          GA_SA_KEY_JSON: ${{ secrets.GA_SA_KEY_JSON }}
          GA_SA_KEY_PATH: ${{ runner.temp }}/ga-service-account.json
          PREVIEW_SITE: ${{ inputs.preview_site }}
        run: |
          if [ -n "$GA_SA_KEY_JSON" ]; then
            printf '%s' "$GA_SA_KEY_JSON" > "$GA_SA_KEY_PATH"
            chmod 600 "$GA_SA_KEY_PATH"
          fi
          if [ -n "$PREVIEW_SITE" ]; then
            # Read-only credential proof — renders one site, writes nothing.
            # `report <slug>` matches on siteSlug(name), NOT the display name, so
            # the input is slugified here rather than handed over raw. Otherwise
            # the obvious input ("Sonder", the name the operator actually sees in
            # Airtable) dies with `No Websites row matched slug "Sonder"`.
            slug=$(printf '%s' "$PREVIEW_SITE" | tr '[:upper:]' '[:lower:]' \
              | sed -E 's/[^a-z0-9]+/-/g; s/^-|-$//g')
            echo "resolving '$PREVIEW_SITE' -> slug '$slug'"
            node dist/cli/bin.js report "$slug" --preview
          else
            node dist/cli/bin.js report --due
          fi

      # Verdict for a preview run. The ANALYTICS block is rendered only when
      # hasAnalyticsData() is true — renderAnalyticsSection returns "" outright
      # when GA produced nothing — so the literal `>ANALYTICS<` in the emitted
      # HTML is a truthful, non-circular proof that the credentials resolved and
      # real numbers came back. Its absence is exactly the #469 failure, which
      # was invisible precisely because the run stayed green without it. Fails
      # the step so the answer cannot be mistaken for a pass.
      - name: Verify the preview carried ANALYTICS
        if: ${{ inputs.preview_site }}
        env:
          PREVIEW_SITE: ${{ inputs.preview_site }}
        run: |
          slug=$(printf '%s' "$PREVIEW_SITE" | tr '[:upper:]' '[:lower:]' \
            | sed -E 's/[^a-z0-9]+/-/g; s/^-|-$//g')
          html="reports/${slug}/draft.html"
          if [ ! -f "$html" ]; then
            echo "::error::no preview rendered at $html — the draft step did not produce a report."
            exit 1
          fi
          if grep -q '>ANALYTICS<' "$html"; then
            echo "PASS: $html contains the ANALYTICS section — GA credentials resolved and returned data."
          else
            echo "::error::FAIL: $html rendered with NO ANALYTICS section. GA/Search Console credentials did not resolve, or GA returned nothing for this property (the #469 failure mode)."
            exit 1
          fi

      - name: Upload the rendered preview
        if: ${{ inputs.preview_site && always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: report-preview
          path: reports/**/draft.html
          if-no-files-found: warn
          retention-days: 7

      # 2. SEND — existing gate (Draft ready ∧ Approved to send ∧ Sent at BLANK).
      # At-least-once: a failed send leaves Sent at null → retried tomorrow; the
      # Resend idempotency key (report:<id>) + the durable Sent at prevent dupes.
      - name: Send approved reports
        # A preview run is a credential proof, not the daily loop — it must not
        # email anyone.
        if: ${{ !inputs.preview_site }}
        timeout-minutes: 15
        env:
          AIRTABLE_PAT: ${{ secrets.AIRTABLE_PAT }}
          AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: node dist/cli/bin.js report --send-ready

      # 3. DIGEST — one "your fleet today" email to the operator (report
      # --digest, shipped in #163; skips itself when there's nothing to say).
      - name: Email the operator digest
        if: ${{ !inputs.preview_site }}
        timeout-minutes: 10
        env:
          AIRTABLE_PAT: ${{ secrets.AIRTABLE_PAT }}
          AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          # Turso creds: the digest reads notify-bounce counts + submissions telemetry from libSQL.
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          # The digest's Renovate/CI signals now come from the nightly-persisted
          # fields (collectRenovateAlerts/collectCiAlerts), so no live GitHub sweep
          # runs here — RENOVATE_TOKEN is no longer needed for this step.
          # Both optional — the CLI falls back to info@reddoorla.com and
          # https://reddoor-maintenance.netlify.app when unset/empty. Set the
          # repo Actions *variables* (not secrets) to override.
          OPERATOR_EMAIL: ${{ vars.OPERATOR_EMAIL }}
          DASHBOARD_BASE_URL: ${{ vars.DASHBOARD_BASE_URL }}
        run: node dist/cli/bin.js report --digest

      # Keepalive (inline, dependency-free): re-enabling an already-enabled
      # workflow is a no-op that still resets GitHub's 60-day auto-disable
      # timer for scheduled workflows on quiet repos. continue-on-error so
      # this hygiene step can never redden the run.
      - name: Keep the scheduled workflow alive
        if: success()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/daily-reports.yml/enable"

      # Outcome gate: the draft step's continue-on-error lets send/digest
      # proceed past a drafting failure, but it also keeps the job green —
      # which would stop the failure() tracking issue below from ever firing.
      # Re-fail the run here (after send/digest/keepalive have had their turn)
      # so a draft failure is still durably visible.
      - name: Fail the run if drafting failed
        if: steps.draft.outcome == 'failure'
        run: |
          echo "::error::the draft step failed earlier in this run (send/digest were allowed to proceed)"
          exit 1

      # M5 alerting (#152 pattern): a red daily run is otherwise only GitHub's
      # best-effort email to the last pusher. File/reopen one deduped tracking
      # issue so a failure is durably visible; auto-close on recovery.
      # continue-on-error so the alert machinery can NEVER turn a run red.
      #
      # Both halves are scoped to non-preview runs. A manual preview is a
      # credential probe, not the daily loop: letting it file "Daily reports run
      # failing" would raise an alarm about a job that never ran, and — far
      # worse — letting a passing probe hit the close half would auto-close a
      # genuinely open daily-failure issue. That is a false all-clear on the one
      # surface that exists to make failures durably visible.
      - name: Open/update the daily-reports-failing tracking issue
        if: ${{ failure() && !inputs.preview_site }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Daily reports run failing"
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          body=$(printf 'The daily **daily-reports** run failed.\n\nRun: %s\n\n_Auto-filed; auto-closes on the next green run._' "$run_url")
          existing=$(gh issue list --state open --json number,title \
            --jq "map(select(.title==\"$title\")) | .[0].number // empty" || true)
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body" && echo "commented on existing #$existing"
          else
            gh issue create --title "$title" --body "$body"
          fi

      - name: Close the daily-reports-failing issue on recovery
        if: ${{ success() && !inputs.preview_site }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Daily reports run failing"
          for n in $(gh issue list --state open --json number,title \
            --jq "map(select(.title==\"$title\")) | .[].number" || true); do
            gh issue close "$n" --comment "Recovered — the daily-reports run is green again." && echo "closed #$n"
          done
