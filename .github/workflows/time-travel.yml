name: time-travel

# Runs the whole suite on a clock shifted forward, to catch tests that secretly depend on
# "today" BEFORE wall time makes them fail on main.
#
# The failure class: a test pins an absolute date fixture but lets the production code fall
# back to `new Date()`. It is green when written and stays green until wall time walks past
# whatever staleness window the code applies — then it is red forever, with nobody having
# touched anything, and the diff that "broke" it is innocent.
#
# This has already happened twice in tests/dashboard/prismic-drift-wiring.test.ts: on
# 2026-08-16 (two tests) and again on 2026-08-19 (a third test sitting twelve lines below
# the comment explaining the trap). The second one held main red for three days: ci.yml
# runs on push and pull_request, and for those three days there was neither — so no run
# happened and the repo had no way to notice it had already broken.
#
# Weekly rather than per-PR: the whole point is detecting decay over time, which a PR check
# cannot see, and the horizon is relative so each run asks "does this still hold 90 days
# from today?" A green run here is a claim about the next quarter, not about this commit.
on:
  schedule:
    - cron: "0 11 * * 1" # Mondays 11:00 UTC — clear of 10:00 fleet-smoke
  workflow_dispatch:
    inputs:
      days:
        description: "Days to travel forward"
        required: false
        default: "90"

concurrency:
  group: time-travel
  cancel-in-progress: false

permissions:
  contents: read
  issues: write # open/close the time-travel tracking issue

jobs:
  time-travel:
    runs-on: ubuntu-latest
    # The suite runs in ~3 min. A hang would otherwise burn the 6h default and, since
    # cancel-in-progress is false, queue next Monday's run behind this one.
    timeout-minutes: 30
    steps:
      # fetch-depth: 0 for the same reason as ci.yml: the suite runs the
      # match-harness snapshot guard, which reads the previous release tag, and a
      # shallow clone has none. Without it every run from 2026-09-21 failed on
      # that one test (#895). tests/ci-gate.test.ts asserts it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Same step as ci.yml: tests/prospect/interaction-harness.test.ts drives a real
      # Chromium and Playwright ships no browser with the npm package. This job ran the
      # suite without it from the day the spec landed, so every weekly run failed on
      # "Executable doesn't exist" and the auto-filed issue (#775) described it as a
      # wall-clock failure. tests/ci-gate.test.ts now asserts every workflow that runs
      # `pnpm test` — as `- run:` or as a named step — installs the browser first.
      - name: Install the browser the Tier 4 abort harness drives
        run: pnpm exec playwright install --with-deps chromium

      # tests/time-travel-guard.test.ts asserts the clock actually moved, so a shim that
      # silently fails to apply turns this job RED instead of reporting a hollow green.
      # That check is the whole reason this job can be trusted — do not skip the suite's
      # guard test or filter it out of this run.
      - name: Run the suite on a forward clock
        id: suite
        env:
          REDDOOR_TIME_TRAVEL_DAYS: ${{ github.event.inputs.days || '90' }}
        run: pnpm test

      # A red scheduled run is otherwise only GitHub's best-effort email to the last
      # pusher — the same blind spot that let the 08-19 breakage sit for three days.
      # continue-on-error so the alert machinery can NEVER turn a run's status red.
      #
      # Scoped to the SUITE step, not bare `failure()`: a lockfile drift or a build break
      # in globalSetup would otherwise file an issue confidently asserting a wall-clock
      # diagnosis, sending the reader hunting for a time bomb that isn't there. Those
      # failures still turn the run red — they just don't get to name their own cause.
      #
      # A CANCELLED suite (a hang to the 30-minute job timeout) files too — `failure()` is
      # false on a cancelled run, so it used to file nothing. Same title, so recovery still
      # closes it, but the body leads with "cancelled, not failed": a hang is not the
      # wall-clock diagnosis the rest of the text asserts.
      #
      # A failure or cancel OUTSIDE the suite step (checkout, `pnpm install --frozen-lockfile`,
      # the browser install — a hang there to the 30-minute limit) used to file nothing at all
      # (P1-15). It now files a SEPARATE issue, not this one: "Time-travel suite failing" is
      # itself a diagnosis, and a setup break commenting on an open wall-clock issue would
      # read as another clock failure. The two conditions are exact complements on the
      # suite step's outcome, so a red run files exactly one of them, and the step that
      # guards the other sits first so it is not still running on a cancelled run.
      - name: Open/update the outside-the-suite tracking issue
        # failure() is false on a CANCELLED run — a hang to a timeout filed nothing
        # for fleet-lighthouse 36451921171. main only: a branch run never speaks
        # for main (a PR-branch dispatch of time-travel closed #895 while main was red).
        if: (failure() || cancelled()) && steps.suite.outcome != 'failure' && steps.suite.outcome != 'cancelled' && github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          JOB_STATUS: ${{ job.status }}
          GH_TOKEN: ${{ github.token }}
          SUITE_OUTCOME: ${{ steps.suite.outcome }}
        run: |
          title="Time-travel run failing outside the suite"
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          body=$(printf 'The weekly **time-travel** run went red, but **not in the suite step** (its outcome: `%s`; `skipped` means an earlier step broke first). So this is **not** a wall-clock finding and says nothing about the tests: checkout, `pnpm install --frozen-lockfile` or the Playwright browser install failed or hung. Fix the environment or the lockfile, then re-run the workflow; the suite itself was never judged.\n\nRun: %s\n\n_Auto-filed; auto-closes on the next green run._' "${SUITE_OUTCOME:-unknown}" "$run_url")
          # A cancelled run is a hang (a step past its timeout-minutes, the job past its
          # limit) or a hand cancel, not the failure the text above describes. Say so.
          if [ "${JOB_STATUS:-}" = "cancelled" ]; then
            body=$(printf '**This run was CANCELLED, not failed**: a step hung past its timeout, the job hit its time limit, or someone cancelled it. The text below was written for a failure; read the step that was running when the run stopped before trusting it.\n\n%s' "$body")
          fi
          existing=$(gh issue list --state open --limit 200 \
            --search "in:title \"$title\"" --json number,title \
            --jq "map(select(.title==\"$title\")) | .[0].number // empty" || true)
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body" && echo "commented on existing #$existing"
          else
            gh issue create --title "$title" --body "$body"
          fi

      - name: Open/update the time-travel tracking issue
        # failure() is false on a CANCELLED run — a hang to a timeout filed nothing
        # for fleet-lighthouse 36451921171. main only: a branch run never speaks
        # for main (a PR-branch dispatch of time-travel closed #895 while main was red).
        if: (failure() || cancelled()) && (steps.suite.outcome == 'failure' || steps.suite.outcome == 'cancelled') && github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          JOB_STATUS: ${{ job.status }}
          GH_TOKEN: ${{ github.token }}
          DAYS: ${{ github.event.inputs.days || '90' }}
        run: |
          title="Time-travel suite failing"
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          body=$(printf 'The weekly **time-travel** run failed at +%s days.\n\nA test depends on the wall clock and will start failing on `main` on its own, without any commit causing it. Find the failing test and freeze its clock (pass an explicit `now`), rather than widening the production window to accommodate it.\n\nIf the failure is `time-travel guard — the shim actually moved the clock`, the shim itself did not apply and every other result in that run is meaningless.\n\nA failed or hung install or browser-install step files the separate "Time-travel run failing outside the suite" issue, not this one. What still lands here without a clock at fault is a break INSIDE the suite step: a globalSetup or build error, or a browser that will not launch (`browserType.launch: Executable` in the log). Then the environment is at fault, not a clock — fix it, not a test.\n\nRun: %s\n\n_Auto-filed; auto-closes on the next green run._' "$DAYS" "$run_url")
          # A cancelled run is a hang (a step past its timeout-minutes, the job past its
          # limit) or a hand cancel, not the failure the text above describes. Say so.
          if [ "${JOB_STATUS:-}" = "cancelled" ]; then
            body=$(printf '**This run was CANCELLED, not failed**: a step hung past its timeout, the job hit its time limit, or someone cancelled it. The text below was written for a failure; read the step that was running when the run stopped before trusting it.\n\n%s' "$body")
          fi
          existing=$(gh issue list --state open --limit 200 \
            --search "in:title \"$title\"" --json number,title \
            --jq "map(select(.title==\"$title\")) | .[0].number // empty" || true)
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body" && echo "commented on existing #$existing"
          else
            gh issue create --title "$title" --body "$body"
          fi

      - name: Close the time-travel issue on recovery
        # main only: a green PR-branch dispatch of time-travel closed #895 while main was red.
        if: success() && github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Time-travel suite failing"
          for n in $(gh issue list --state open --limit 200 \
            --search "in:title \"$title\"" --json number,title \
            --jq "map(select(.title==\"$title\")) | .[].number" || true); do
            gh issue close "$n" --comment "Recovered — the time-travel run is green again." && echo "closed #$n"
          done

      - name: Close the outside-the-suite issue on recovery
        # main only: a green PR-branch dispatch of time-travel closed #895 while main was red.
        if: success() && github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Time-travel run failing outside the suite"
          for n in $(gh issue list --state open --limit 200 \
            --search "in:title \"$title\"" --json number,title \
            --jq "map(select(.title==\"$title\")) | .[].number" || true); do
            gh issue close "$n" --comment "Recovered — the time-travel run got through setup and is green again." && echo "closed #$n"
          done
