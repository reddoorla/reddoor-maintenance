name: release-health

# Two INDEPENDENT guards on the release pipeline. Either one alone is blind; the pair is not.
#
# 1. npm DRIFT — main's package.json version advances on every Version-Packages merge and SHOULD
#    be published by the release workflow. But `changesets/action` only runs `changeset publish`
#    on a push to main that has ZERO changeset files — so a rapid run of changeset-carrying PRs
#    can keep the workflow in "update the release PR" mode and never publish (exactly how 0.48.0 /
#    0.49.1 were version-bumped on main but never reached npm). Compares the npm `latest` tag to
#    main's version. Fix is always: merge the open Version Packages PR into a clean main.
#
# 2. release WORKFLOW REDNESS — the drift check compares VERSIONS, so it is structurally blind to
#    a release workflow that is failing while npm and main happen to agree. That blind spot has
#    now bitten three times, most starkly 2026-07-20..24: npm 12 changed `npm info --json` to
#    return an array, which broke changesets' published-version detection, so every push to main
#    tried to re-publish an already-published version, got E403, and crashed. Four days of red
#    release runs, ZERO drift, no alarm — found only because a human noticed the dashboard. This
#    check looks at the release workflow's own most recent decisive run on main.
#
# Each guard reds the run and files its own deduped tracking issue, auto-closed once it recovers.
on:
  schedule:
    - cron: "30 14 * * *" # 14:30 UTC daily — clear of the 06:00/08:00/09:23 nightly churn
  workflow_dispatch: {}

concurrency:
  group: release-health
  cancel-in-progress: false

permissions:
  contents: read
  issues: write
  actions: read # read the release workflow's own run history (guard 2)

jobs:
  check:
    runs-on: ubuntu-latest
    # A hung `npm view` / DNS lookup would otherwise sit at GitHub's 6-hour default, and with
    # concurrency.cancel-in-progress=false it would pin the group and queue every later daily run.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Compare npm latest vs main version
        id: drift
        run: |
          name=$(node -p "require('./package.json').name")
          pkg=$(node -p "require('./package.json').version")
          npmv=$(npm view "$name" version 2>/dev/null || echo "")
          echo "main=$pkg npm=${npmv:-<unpublished>}"
          # behind = npm's published version is strictly lower than main's (major.minor.patch,
          # prerelease tags stripped). An unpublished package ("") compares as 0.0.0 → behind.
          behind=$(node -e '
            const t = (v) => (v || "0.0.0").split("-")[0].split(".").map(Number);
            const [a, b] = [t(process.argv[1]), t(process.argv[2])];
            let r = "no";
            for (let i = 0; i < 3; i++) { const x = a[i] || 0, y = b[i] || 0; if (x !== y) { r = x < y ? "yes" : "no"; break; } }
            process.stdout.write(r);
          ' "$npmv" "$pkg")
          {
            echo "pkg=$pkg"
            echo "npmv=${npmv:-<unpublished>}"
            echo "behind=$behind"
          } >> "$GITHUB_OUTPUT"
          if [ "$behind" = "yes" ]; then
            echo "::error::npm is behind main — published ${npmv:-<unpublished>} but main is at $pkg. A release didn't publish; merge the Version Packages PR into a clean main."
          fi

      # Guard 2 — is the release workflow ITSELF healthy on main? Independent of drift: a release
      # run can fail on every push while npm and main agree on the version (npm 12 / changesets,
      # 2026-07-20..24), and guard 1 sees nothing wrong.
      - name: Check the release workflow's own state on main
        id: relstate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Newest DECISIVE run only. `cancelled` / `skipped` / `action_required` are excluded
          # rather than treated as red — release.yml serialises on a concurrency group, so a
          # queued-then-cancelled run says nothing about pipeline health. If the newest decisive
          # run is green, an older failure has already been superseded and we are clear.
          latest=$(gh api \
            "/repos/${{ github.repository }}/actions/workflows/release.yml/runs?branch=main&per_page=30" \
            --jq '[.workflow_runs[]
                   | select(.status == "completed")
                   | select(.conclusion == "success" or .conclusion == "failure" or .conclusion == "timed_out")]
                  | .[0] // empty
                  | "\(.conclusion)\t\(.html_url)\t\(.head_sha)"' || true)
          concl=$(printf '%s' "$latest" | cut -f1)
          url=$(printf '%s' "$latest" | cut -f2)
          sha=$(printf '%s' "$latest" | cut -f3)
          # No decisive run at all (fresh repo, or the API call failed) → nothing to judge. Stay
          # silent rather than alarm; a broken query must not masquerade as a broken pipeline.
          if [ -z "$concl" ]; then
            echo "no decisive release run on main — skipping guard 2"
            red=no
          elif [ "$concl" = "success" ]; then
            red=no
          else
            red=yes
          fi
          echo "release workflow latest decisive run on main: ${concl:-<none>} (${sha:-n/a})"
          {
            echo "red=$red"
            echo "concl=${concl:-none}"
            echo "url=${url:-n/a}"
            echo "sha=${sha:-n/a}"
          } >> "$GITHUB_OUTPUT"
          if [ "$red" = "yes" ]; then
            echo "::error::The release workflow's latest run on main is '$concl' ($url). Releases are blocked even though npm and main agree on the version."
          fi

      # File/reopen a single deduped tracking issue (by exact title — only needs issues:write).
      # continue-on-error so the alert machinery can never flip the run's own status.
      - name: Open/update the npm-drift tracking issue
        if: steps.drift.outputs.behind == 'yes'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="npm registry is behind main"
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          body=$(printf 'The npm `latest` tag is **behind** main: published `%s`, main `package.json` is `%s`.\n\nA version bump merged but the release workflow never ran `changeset publish` — usually because back-to-back changeset PRs kept the changesets action in "update the release PR" mode. **Fix:** merge the open **Version Packages** PR into a clean main (no other pending changesets) so the publish step fires.\n\nRun: %s\n\n_Auto-filed; auto-closes once npm catches up._' "${{ steps.drift.outputs.npmv }}" "${{ steps.drift.outputs.pkg }}" "$run_url")
          existing=$(gh issue list --state open --json number,title \
            --jq "map(select(.title==\"$title\")) | .[0].number // empty" || true)
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body" && echo "commented on #$existing"
          else
            gh issue create --title "$title" --body "$body"
          fi

      - name: Close the drift issue once npm catches up
        if: steps.drift.outputs.behind != 'yes'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="npm registry is behind main"
          for n in $(gh issue list --state open --json number,title \
            --jq "map(select(.title==\"$title\")) | .[].number" || true); do
            gh issue close "$n" --comment "npm caught up — \`latest\` now matches main. Closing." && echo "closed #$n"
          done

      - name: Open/update the release-failing tracking issue
        if: steps.relstate.outputs.red == 'yes'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Release workflow is failing on main"
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          body=$(printf 'The `release` workflow'"'"'s latest decisive run on `main` is **%s**.\n\nFailing run: %s\nCommit: `%s`\n\nnpm and main agree on the version, so the drift guard is silent — but **nothing can publish until this is green**. Open the failing run and read the `Create release PR or publish` step; that is where changesets reports both version and publish errors.\n\nRun: %s\n\n_Auto-filed; auto-closes once the release workflow goes green on main._' \
            "${{ steps.relstate.outputs.concl }}" "${{ steps.relstate.outputs.url }}" "${{ steps.relstate.outputs.sha }}" "$run_url")
          existing=$(gh issue list --state open --json number,title \
            --jq "map(select(.title==\"$title\")) | .[0].number // empty" || true)
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body" && echo "commented on #$existing"
          else
            gh issue create --title "$title" --body "$body"
          fi

      - name: Close the release-failing issue once it goes green
        if: steps.relstate.outputs.red != 'yes'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Release workflow is failing on main"
          for n in $(gh issue list --state open --json number,title \
            --jq "map(select(.title==\"$title\")) | .[].number" || true); do
            gh issue close "$n" --comment "The release workflow is green on main again. Closing." && echo "closed #$n"
          done

      # Red the run on either signal (after both issues are filed) so it surfaces beyond the issues.
      - name: Fail when unhealthy
        if: steps.drift.outputs.behind == 'yes' || steps.relstate.outputs.red == 'yes'
        run: exit 1
