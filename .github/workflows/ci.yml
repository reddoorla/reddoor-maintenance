name: ci

on:
  push:
    # `changeset-release/main` is the Changesets "Version Packages" bot branch.
    # Its PR opens via the reddoor-renovate App token (see release.yml) so a pull_request event
    # DOES fire — but GitHub gates pull_request runs from that automation behind
    # manual approval, leaving every release PR's required `build` check stuck in
    # "action_required" and unmergeable without an admin approving each re-push.
    # A push event is not subject to that approval gate and produces the same
    # `build` check on the same SHA, so listing the branch here lets the release
    # PR go green on its own.
    branches: [main, changeset-release/main, staging]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # These steps ARE `pnpm verify`, listed individually so a failure is
      # attributable at a glance in the Actions UI. They are not a second,
      # hand-maintained list: tests/ci-gate.test.ts derives the expected
      # commands from the `verify` script and fails if this list drifts from it
      # in content or order. Add a gate to `verify` in package.json and this
      # file must follow — the test says so.
      #
      # Why it matters: when the two really were maintained separately, a local
      # `lint && build && test` passed while CI failed on typecheck (the only
      # step that typechecks tests/**), and nothing local ran test:dist at all.
      #
      # test:coverage rather than test — it enforces the floor in
      # vitest.config.ts. Plain `pnpm test` stays fast for local TDD.
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm test:coverage
      - run: pnpm test:dist

      # Test-suite tripwire: fail if build+tests left the tree dirty. dist/,
      # coverage/, .vitest-cache/ are gitignored, so anything here is a real leak
      # — e.g. a test that writes into the repo instead of os.tmpdir(). NOTE this
      # does NOT exercise the fleet a11y orphan (.reddoor-a11y-spec-*): that class
      # only occurs in local `audit` runs against a real checkout, not in unit
      # tests here nor in fleet-lighthouse.yml (lighthouse-only, deployed URLs,
      # /tmp workdir). It's backstopped by the gitignore entry + try/finally in
      # src/audits/a11y.ts. (2026-06-10 autonomy hardening.)
      - name: Working tree clean after build + tests
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::build/tests left the working tree dirty:"
            git status --porcelain
            git diff
            exit 1
          fi
