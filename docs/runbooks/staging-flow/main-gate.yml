name: main-gate
on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited, labeled, unlabeled]
    branches: [main]
permissions:
  contents: read
  pull-requests: read
  issues: read
jobs:
  main-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Only staging, or a Renovate patch or minor, may merge into main
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          set -euo pipefail
          BOT='reddoor-renovate[bot]'
          LABEL='fast-track'
          # api <what> <gh api args>: read into $out. A 5xx, a 429, a rate-limit
          # 403 or a failure with no HTTP status is read again after 2, 8 and
          # 30 s; any other failure, or a fourth, ends the step naming <what>.
          api() {
            local what="$1" err status wait tries=0 transient
            shift
            err="$(mktemp)"
            for wait in 2 8 30 -; do
              tries=$((tries + 1))
              if out="$(gh api "$@" 2> "$err")"; then
                rm -f "$err"
                return 0
              fi
              status="$(grep -oE 'HTTP [0-9]{3}' "$err" | tail -n 1 || true)"
              case "$status" in
                'HTTP 5'?? | 'HTTP 429' | '') transient=1 ;;
                'HTTP 403') if grep -qi 'rate limit' "$err"; then transient=1; else transient=0; fi ;;
                *) transient=0 ;;
              esac
              if [ "$transient" = 0 ] || [ "$wait" = - ]; then
                [ "$tries" = 1 ] && tries='1 try' || tries="$tries tries"
                echo "::error::main-gate: could not read $what: ${status:-no HTTP status} after $tries. gh said: $(tr '\r\n' '  ' < "$err" | cut -c 1-300)"
                rm -f "$err"
                exit 1
              fi
              echo "main-gate: reading $what failed (${status:-no HTTP status}); reading it again in ${wait}s."
              sleep "$wait"
            done
          }
          if [ "$HEAD_REPO" != "$REPO" ]; then
            echo "::error::main-gate: head is $HEAD_REPO:$HEAD_REF, not a branch of $REPO."
            exit 1
          fi
          if [ "$HEAD_REF" = "staging" ]; then
            echo "main-gate: promotion from staging."
            exit 0
          fi
          if [ "$AUTHOR" != "$BOT" ] || [ "${HEAD_REF#renovate/}" = "$HEAD_REF" ]; then
            echo "::error::main-gate: $HEAD_REF by $AUTHOR. Only staging, or a $BOT patch or minor on a renovate/ branch, may merge into main. Open this PR against staging."
            exit 1
          fi
          api "the commits of #$PR" --paginate "repos/$REPO/pulls/$PR/commits" --jq '.[] | "\(.sha[0:7]) \(.author.login // "-") \(.committer.login // "-") \(.commit.verification.verified)"'
          commits="$out"
          if [ -z "$commits" ]; then
            echo "::error::main-gate: the commits of #$PR came back empty."
            exit 1
          fi
          others="$(printf '%s\n' "$commits" | awk -v bot="$BOT" '$2 != bot || $3 != "web-flow" || $4 != "true"')"
          if [ -n "$others" ]; then
            echo "::error::main-gate: every commit on $HEAD_REF must be authored by $BOT and committed and signed by GitHub (web-flow, verified). Not so: $(printf '%s' "$others" | tr '\n' ';')"
            exit 1
          fi
          for wait in 2 4 8 16 30 -; do
            api "the activity feed on $HEAD_REF" --paginate "repos/$REPO/activity?ref=refs/heads/$HEAD_REF" --jq '.[] | "\(.activity_type) \(.actor.login) \(.after)"'
            activity="$out"
            newest="$(awk 'NR == 1 { print $3 }' <<< "$activity")"
            created="$(awk '$1 == "branch_creation" { n++ } END { print n + 0 }' <<< "$activity")"
            if { [ "$newest" = "$HEAD_SHA" ] && [ "$created" -gt 0 ]; } || [ "$wait" = - ]; then
              break
            fi
            echo "main-gate: the activity feed on $HEAD_REF does not yet reach $HEAD_SHA from a branch_creation; reading it again in ${wait}s."
            sleep "$wait"
          done
          if [ "$newest" != "$HEAD_SHA" ] || [ "$created" -eq 0 ]; then
            echo "::error::main-gate: could not read who pushed to $HEAD_REF. The activity feed does not reach the head, $HEAD_SHA, from a branch_creation."
            exit 1
          fi
          pushers="$(awk '{ print $2 } $1 == "branch_creation" { exit }' <<< "$activity")"
          strangers="$(printf '%s\n' "$pushers" | grep -vxF "$BOT" || true)"
          if [ -n "$strangers" ]; then
            echo "::error::main-gate: $HEAD_REF was also pushed to by: $(printf '%s' "$strangers" | sort -u | tr '\n' ' '). Commit metadata can be set by any writer; who pushed cannot."
            exit 1
          fi
          api "the files of #$PR" --paginate "repos/$REPO/pulls/$PR/files" --jq '.[] | .filename, (.previous_filename // empty)'
          files="$out"
          if [ -z "$files" ]; then
            echo "::error::main-gate: the files of #$PR came back empty."
            exit 1
          fi
          outside="$(printf '%s\n' "$files" | grep -vxE 'package\.json|pnpm-lock\.yaml|pnpm-workspace\.yaml|\.nvmrc|\.github/workflows/[^/]+\.ya?ml' || true)"
          if [ -n "$outside" ]; then
            echo "::error::main-gate: a fast-track update may change only dependency manifests and workflow pins. Also changed: $(printf '%s' "$outside" | tr '\n' ' ')"
            exit 1
          fi
          api "the labels of #$PR" "repos/$REPO/issues/$PR/labels" --jq '.[].name'
          if ! grep -qxF "$LABEL" <<< "$out"; then
            echo "::error::main-gate: $HEAD_REF has no '$LABEL' label, so it is not a patch or minor under the staging-flow preset. Majors and everything else target staging."
            exit 1
          fi
          api "the label events of #$PR" --paginate "repos/$REPO/issues/$PR/events" --jq ".[] | select(.event == \"labeled\" and .label.name == \"$LABEL\") | .actor.login"
          adder="$(tail -n 1 <<< "$out")"
          if [ "$adder" != "$BOT" ]; then
            echo "::error::main-gate: '$LABEL' was last added by '${adder:-nobody}', not $BOT."
            exit 1
          fi
          echo "main-gate: $BOT patch or minor on $HEAD_REF."
